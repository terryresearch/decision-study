<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{
  --ink:#17212B; --body:#2B3540; --muted:#5E6772; --faint:#8C939A;
  --paper:#ECE7DC; --paper2:#F5F2EA; --card:#FFFEFB; --line:#D6CEBE; --line2:#E3DDD0;
  --chip:#ECE7DC; --chipText:#3D4752; --yes:#1F3A57; --yesText:#F5F2EA; --rules:#F3EFE6;
  --arrow:#C77A2A; --arrowBg:#FBF1E4; --err:#9B2C1F; --errBg:#FBEDE9; --okBg:#EEF3EC; --ok:#2F5D45;
  --shadow:0 6px 26px rgba(23,33,43,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--paper);color:var(--body);font:400 17px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--ink)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.top{position:sticky;top:0;z-index:30;background:rgba(236,231,220,.94);backdrop-filter:saturate(1.2) blur(6px);-webkit-backdrop-filter:blur(6px)}
.top .in{max-width:1240px;height:50px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:20px}
.top .label{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.top .section{margin-left:auto;font-size:14px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .bar{height:3px;background:var(--line2)}
.top .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .45s ease}
main{max-width:1240px;margin:0 auto;padding:34px 28px 72px}
.page{max-width:760px;margin:0 auto}
.page.wide{max-width:960px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px 44px}
h1{font-size:28px;line-height:1.22;font-weight:600;color:var(--ink);margin:0 0 18px;letter-spacing:-.01em}
p{margin:0 0 14px}
.prose p{max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.lead{font-weight:500;color:var(--ink)}
hr{border:0;border-top:1px solid var(--line2);margin:24px 0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;background:var(--ink);color:var(--paper2);font-weight:600;font-size:16px;line-height:1;padding:15px 30px;cursor:pointer;transition:opacity .15s,background .15s;white-space:nowrap}
.btn:disabled{opacity:.25;cursor:not-allowed}
.btn:not(:disabled):hover{background:#26323E}
.btn:focus-visible,.opt:focus-visible,.scale button:focus-visible,.sl input:focus-visible{outline:3px solid #7FA3C6;outline-offset:2px}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:30px}
.foot .hint{margin-right:auto;font-size:14.5px;color:var(--muted)}
.foot .err{margin-right:auto;font-size:15px;color:var(--err);font-weight:500}
.letter p{font-size:16.5px}
.letter .sig{margin-top:22px;line-height:1.5}
.letter .linkbtn{background:none;border:0;padding:0;font-size:14.5px;color:var(--muted);text-decoration:underline;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border:1.5px solid var(--line2);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;transition:border-color .12s,background .12s,box-shadow .12s}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--paper2);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #9AA1A8;position:relative;background:var(--card)}
.opt[aria-checked="true"] .dot{border-color:var(--ink)}
.opt[aria-checked="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.opt.box .dot{border-radius:5px}
.opt.box[aria-checked="true"] .dot{background:var(--ink)}
.opt.box[aria-checked="true"] .dot::after{inset:auto;left:5px;top:1px;width:5px;height:10px;border-radius:0;background:none;border:solid var(--paper2);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:disabled{cursor:default}
.opt .txt{flex:1;min-width:0}
.opt.tile{padding:14px 18px;gap:16px}
.opt.tile .h{display:block;margin:0;font-size:17.5px;line-height:1.3;font-weight:600;color:var(--ink)}
.opt.tile .p{display:block;margin:3px 0 0;font-size:15.5px;line-height:1.42;color:var(--body)}
.ico{flex:none;display:block}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.compact .opt{padding:11px 14px}
@media (hover:hover){ .opt:hover{border-color:#B8AF9F} .scale button:hover{border-color:#B8AF9F} }
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.scale button{height:54px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;font:600 17px/1 'IBM Plex Mono',monospace;color:var(--body);transition:border-color .12s,background .12s;padding:0}
.scale button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.anchors2{display:flex;justify-content:space-between;gap:20px;margin-top:9px;font-size:14px;color:var(--muted)}
.anchors2 span:last-child{text-align:right}
.sl{position:relative;padding:46px 0 0;user-select:none;-webkit-user-select:none}
.sl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:34px;margin:0;background:transparent;cursor:pointer;touch-action:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line2)}
.sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line2)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 1px 5px rgba(23,33,43,.35)}
.sl input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 1px 5px rgba(23,33,43,.35)}
.sl input.untouched::-webkit-slider-thumb{opacity:0}
.sl input.untouched::-moz-range-thumb{opacity:0}
.sl .bubble{position:absolute;top:0;transform:translateX(-50%);font:600 15px/1 'IBM Plex Mono',monospace;background:var(--ink);color:var(--paper2);padding:7px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}
.sl .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.sl .bubble[hidden]{display:none}
.sl .ticks{position:relative;height:9px;margin-top:-4px}
.sl .ticks i{position:absolute;top:0;width:2px;height:9px;margin-left:-1px;background:#B8AF9F;border-radius:1px}
.sl .anch{position:relative;height:44px;margin-top:6px;font-size:14px;line-height:1.3;color:var(--muted)}
.sl .anch span{position:absolute;top:0;width:150px;margin-left:-75px;text-align:center}
.sl .anch span.l{left:0 !important;margin-left:0;text-align:left}
.sl .anch span.r{left:auto !important;right:0;margin-left:0;text-align:right}
.sl-help{margin-top:6px;font-size:14px;color:var(--muted)}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 28px 28px;display:flex;flex-direction:column;gap:15px;user-select:none;-webkit-user-select:none;cursor:default}
.mc-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-block;font-size:14px;font-weight:500;line-height:1.3;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--chipText)}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.brand svg{display:block}
.mc-title{font-size:24px;line-height:1.3;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.mc-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;color:var(--muted)}
.mc-prices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc-prices div{font:600 22px/1 'IBM Plex Mono',monospace;text-align:center;padding:16px 0;border-radius:12px}
.mc-prices .yes{background:var(--yes);color:var(--yesText)}
.mc-prices .no{background:var(--chip);color:var(--body)}
.mc-chart{display:block;width:100%;height:116px}
.mc-rules{font-size:14.5px;line-height:1.45;background:var(--rules);color:var(--chipText);padding:12px 15px;border-radius:10px}
.mc-rules b{color:var(--ink)}
.mcard [data-t]{transition:outline-color .2s}
.mcard [data-t].hl{outline:3px solid var(--arrow);outline-offset:4px;border-radius:10px}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
.split .lcol{position:sticky;top:76px}
.qpanel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 30px 28px;display:flex;flex-direction:column;min-height:440px}
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.qbar{display:flex;gap:4px;margin:10px 0 24px}
.qbar i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.qbar i.on{background:var(--ink)}
.qtext{font-size:20px;line-height:1.42;font-weight:600;color:var(--ink);margin:0 0 18px}
.qsub{font-size:15.5px;color:var(--muted);margin:-8px 0 18px}
.qbody{flex:1}
.qpanel .foot{margin-top:26px}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.chosen{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 9px;border-radius:999px;background:var(--paper2);border:1px solid var(--line2);font-size:15px;color:var(--body);margin-bottom:18px}
.chosen b{color:var(--ink);font-weight:600}
.stem{font-size:15px;color:var(--muted);margin:0 0 4px}
.stage{position:relative;display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,520px) minmax(170px,1fr);column-gap:64px;align-items:start;margin-top:8px}
.stage .col{position:relative;align-self:stretch}
.cwrap{position:relative}
.callout{position:absolute;left:0;right:0;padding:8px 10px;border-radius:10px;font-size:14.5px;line-height:1.42;color:var(--body);transition:opacity .2s,background .2s,box-shadow .2s}
.col.left .callout{text-align:right}
.callout b{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink)}
.col.left .callout b{flex-direction:row-reverse}
.n{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--arrow);color:#fff;font:600 12.5px/1 'IBM Plex Mono',monospace}
.callout p{margin:3px 0 0}
.callout.hl{background:var(--arrowBg);box-shadow:inset 0 0 0 2px var(--arrow)}
.stage.focus .callout:not(.hl){opacity:.32}
.stage.focus svg.arrows path:not(.hl){opacity:.22}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.arrows path{fill:none;stroke:var(--arrow);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.arrows path.hl{stroke-width:3}
.badges{position:absolute;inset:0;pointer-events:none}
.badges .n{position:absolute;box-shadow:0 0 0 2px var(--card)}
.calllist{display:none;list-style:none;margin:22px 0 0;padding:0;gap:4px}
.calllist li{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:10px;font-size:15.5px;line-height:1.42}
.calllist li b{color:var(--ink);font-weight:600}
.calllist li.hl{background:var(--arrowBg);box-shadow:inset 0 0 0 2px var(--arrow)}
.stage.focus .calllist li:not(.hl){opacity:.4}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:12px;background:var(--arrowBg);border:1px solid #EBCFA8;color:var(--body);font-size:15.5px;margin:0 0 22px}
.note.ok{background:var(--okBg);border-color:#C9D9CC}
.note b{color:var(--ink)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:6px 0 24px}
.ttile{border:1px solid var(--line2);border-radius:16px;padding:22px 22px 20px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.ttile h3{margin:6px 0 0;font-size:18.5px;font-weight:600;color:var(--ink)}
.ttile p{margin:0;font-size:15.5px;line-height:1.45}
.ttile .ex{font-style:italic;color:var(--muted)}
table.mx{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
table.mx thead th{position:sticky;top:53px;z-index:5;background:var(--card);font-size:12.5px;font-weight:600;line-height:1.25;color:var(--muted);padding:10px 4px 12px;border-bottom:1px solid var(--line2);vertical-align:bottom;text-align:center}
table.mx thead th:first-child{text-align:left}
table.mx td{border-bottom:1px solid var(--line2);padding:0;text-align:center}
table.mx td.it{text-align:left;font-size:15.5px;line-height:1.42;padding:13px 16px 13px 0;color:var(--body)}
table.mx td.anchcell{display:none}
table.mx tr.miss td.it{color:var(--err)}
table.mx label{display:flex;align-items:center;justify-content:center;height:100%;min-height:52px;cursor:pointer}
table.mx label .num{display:none}
table.mx input{width:19px;height:19px;accent-color:var(--ink);cursor:pointer;margin:0}
.field{margin:0 0 26px}
.field>label.q,.field>.q{display:block;font-weight:600;color:var(--ink);font-size:17px;margin:0 0 10px;line-height:1.4}
.field .sub{display:block;font-weight:400;color:var(--muted);font-size:14.5px;margin-top:2px}
input[type=number],input[type=text]{font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
input[type=number]{width:140px}
.inline{display:flex;align-items:center;gap:10px}
.reveal{border-left:3px solid var(--line2);padding-left:20px;margin-left:2px}
textarea.dump{width:100%;min-height:120px;font:13px/1.4 'IBM Plex Mono',monospace;border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--paper2)}
#testpill{position:fixed;left:12px;bottom:12px;z-index:60;font:500 12.5px/1.3 'IBM Plex Sans',sans-serif;background:var(--ink);color:var(--paper2);border-radius:999px;padding:8px 14px;opacity:.85;display:flex;gap:10px;align-items:center}
#testpill a{color:#F2C894;text-decoration:none;cursor:pointer}
#toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper2);padding:10px 16px;border-radius:10px;font-size:14.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:899px){
  main{padding:22px 18px 56px}
  .top .in{padding:0 18px}
  .panel{padding:28px 26px}
  .split{grid-template-columns:1fr;gap:16px}
  .split .lcol{position:static}
  .qpanel{min-height:0;padding:22px 22px 24px}
  .stage{display:block;max-width:560px;margin:8px auto 0;padding-left:14px}
  .stage .col,.stage svg.arrows{display:none}
  .calllist{display:grid}
  .explain-foot{max-width:560px;margin-left:auto;margin-right:auto}
}
@media (max-width:700px){
  .tiles3{grid-template-columns:1fr}
  table.mx thead{display:none}
  table.mx,table.mx tbody{display:block;width:100%}
  table.mx tr{display:flex;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line2)}
  table.mx td{border:0;flex:1 1 0;min-width:0}
  table.mx td.it{flex:1 1 100%;padding:0 0 8px}
  table.mx td.anchcell{display:flex;flex:1 1 100%;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:2px}
  table.mx label{flex-direction:column;gap:3px;min-height:46px}
  table.mx label .num{display:block;font:500 12px/1 'IBM Plex Mono',monospace;color:var(--muted)}
}
@media (max-width:600px){
  body{font-size:16px}
  main{padding:16px 12px 44px}
  .top .in{padding:0 14px;gap:12px}
  .top .label{font-size:11.5px}
  .top .section{font-size:13px}
  .panel{padding:22px 18px;border-radius:16px}
  h1{font-size:23px}
  .letter p{font-size:15.5px}
  .qpanel{padding:18px 16px 20px;border-radius:16px}
  .qtext{font-size:18px}
  .opt{padding:12px 14px;gap:12px}
  .opt.tile .h{font-size:16.5px}
  .opt.tile .p{font-size:14.5px}
  .mcard{padding:18px 18px 20px;gap:12px;border-radius:16px}
  .mc-title{font-size:20px}
  .mc-meta{font-size:13.5px}
  .mc-prices div{font-size:19px;padding:13px 0}
  .mc-chart{height:84px}
  .mc-rules{font-size:13.5px;padding:10px 12px}
  .scale{gap:5px}
  .scale button{height:46px;font-size:16px}
  .anchors2{font-size:13px}
  .sl .anch{font-size:12.5px}
  .sl .anch span{width:32%;margin-left:-16%}
  .cols3{grid-template-columns:1fr}
  .foot{flex-wrap:wrap;gap:10px}
  .foot .hint,.foot .err{flex:1 1 100%;margin:0}
  .foot .btn{flex:1 1 100%;padding:16px 20px}
  .ttile{padding:18px}
  .calllist li{font-size:15px}
}
@media print{
  .top,#toast,#testpill,.foot{display:none !important}
  body{background:#fff}
  .panel{border:0;box-shadow:none;padding:0}
  main{padding:0}
}</style>
</head>
<body>
<header class="top" id="top">
  <div class="in"><span class="label">Research study</span><span class="section" id="section"></span></div>
  <div class="bar"><i id="barfill"></i></div>
</header>
<main id="app" aria-live="polite"></main>
